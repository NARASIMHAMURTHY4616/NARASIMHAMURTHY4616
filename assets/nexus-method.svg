<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#65F6E0"/></marker></defs>
<rect width="1200" height="230" fill="#080B12"/>
<text x="45" y="26" font-size="12" letter-spacing="4" fill="#8492A6">ENGINEERING LOOP</text>
