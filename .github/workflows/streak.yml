name: ⚔️ Update Warrior Streak

on:
  schedule:
    # Every day at 03:00 UTC = 08:30 IST
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    name: Generate GitHub Streak
    runs-on: ubuntu-latest

    steps:
      - name: ⚔️ Checkout Chronicle
        uses: actions/checkout@v6

      - name: 🔥 Generate streak card
        uses: zients/github-readme-streak-stats@v2
        with:
          user: NARASIMHAMURTHY4616
          starting_year: 2026
          card_width: 495
          card_height: 195
          disable_animations: false
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛡️ Commit updated streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No streak changes."
            exit 0
          fi

          git commit -m "⚔️ Update warrior streak"
          git push
